name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ciso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check engine.js && node --check app.js && node --check browser-test.js && node test.js
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node browser-test.js
